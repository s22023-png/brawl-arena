<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brawl Arena Ultimate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{background:#0a0e17;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:#fff;touch-action:manipulation}
#gameContainer{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#1a2233 0%,#0a0e17 70%)}
canvas{display:block;background:#1e2a3a;border-radius:8px;box-shadow:0 0 40px rgba(0,200,255,.15);max-width:100%;max-height:100%}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}
.hud-box{background:rgba(0,0,0,.65);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.hud-box .label{opacity:.7;font-size:10px}.hud-box .value{color:#ffd700;font-size:16px}
#abilityBar{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;z-index:20}
.ability{width:52px;height:52px;border-radius:12px;background:rgba(0,0,0,.7);border:3px solid #555;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;position:relative;overflow:hidden}
.ability.ready{border-color:#00e5ff;box-shadow:0 0 12px #00e5ff}
.ability .cd{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:10px;text-align:center}
#hcBar{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);width:180px;height:10px;background:rgba(0,0,0,.6);border-radius:5px;border:2px solid #a55eea;overflow:hidden}
#hcFill{height:100%;width:0%;background:linear-gradient(90deg,#a55eea,#ff00ff);transition:width .1s}
.menu{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(8,12,22,.95);backdrop-filter:blur(12px);z-index:20;pointer-events:auto;overflow-y:auto;padding:12px}.menu button,.menu .btn{pointer-events:auto!important;touch-action:manipulation!important;cursor:pointer}
.menu.hidden{display:none}
.title{font-size:clamp(26px,6vw,48px);font-weight:900;background:linear-gradient(135deg,#00e5ff,#ff6b00,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{font-size:12px;opacity:.6;margin-bottom:10px}
.currency-bar{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:30;flex-wrap:wrap;justify-content:flex-end}
.currency{background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:4px 10px;font-weight:900;font-size:12px}
.currency.coins{border-color:#ffd700;color:#ffd700}.currency.gems{border-color:#00e5ff;color:#00e5ff}.currency.trophies{border-color:#ff6b00;color:#ff6b00}
.rank-badge{background:linear-gradient(135deg,#ff6b00,#ffd700);color:#0a0e17;border-radius:16px;padding:4px 10px;font-weight:900;font-size:11px}
.brawler-select{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;max-width:960px;max-height:260px;overflow-y:auto}
.brawler-card{width:100px;background:rgba(255,255,255,.06);border:3px solid transparent;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.brawler-card:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.brawler-card.selected{border-color:#00e5ff;background:rgba(0,229,255,.15)}
.brawler-card.locked{opacity:.4;filter:grayscale(.7);cursor:not-allowed}
.brawler-card.locked::after{content:'🔒';position:absolute;top:4px;right:4px;font-size:12px}
.brawler-icon{width:40px;height:40px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
.brawler-name{font-size:11px;font-weight:900}.brawler-rarity{font-size:8px;opacity:.8}.brawler-desc{font-size:8px;opacity:.55;line-height:1.2}
.rarity-common{color:#b0b0b0}.rarity-rare{color:#54a0ff}.rarity-epic{color:#a55eea}.rarity-legendary{color:#ffd700;text-shadow:0 0 5px #ff6b00}.rarity-mythic{color:#ff006e;text-shadow:0 0 6px #ff006e}
.btn{background:linear-gradient(135deg,#00c853,#00e5ff);color:#0a0e17;border:none;padding:10px 24px;font-size:14px;font-weight:900;border-radius:40px;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,200,100,.3)}
.btn:hover{transform:scale(1.03)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.secondary{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;margin-top:5px}
.btn.gacha{background:linear-gradient(135deg,#a55eea,#ff6b00)}.btn.gem{background:linear-gradient(135deg,#00e5ff,#54a0ff)}
.btn.ranked{background:linear-gradient(135deg,#ff6b00,#ffd700)}.btn.daily{background:linear-gradient(135deg,#e91e63,#ff6b00)}
.menu-buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#gameOverStats{background:rgba(0,0,0,.5);border-radius:12px;padding:14px 20px;margin-bottom:12px;text-align:center;min-width:220px}
#gameOverStats .stat{font-size:14px;margin:3px 0}#gameOverStats .stat span{color:#ffd700;font-weight:900}
.tab-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.tab-btn{background:rgba(255,255,255,.08);border:2px solid transparent;color:#fff;padding:6px 12px;border-radius:16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:12px}
.tab-btn.active{border-color:#00e5ff;background:rgba(0,229,255,.15)}

/* ===== High Quality Gacha Effects ===== */
#gachaStage{position:relative;width:280px;height:320px;margin:0 auto;display:flex;align-items:center;justify-content:center;perspective:800px}
.gacha-box{
  width:100px;height:100px;border-radius:16px;
  background:linear-gradient(145deg,#2a2a4a,#1a1a2e);
  border:3px solid #666;display:flex;align-items:center;justify-content:center;
  font-size:40px;box-shadow:0 8px 32px rgba(0,0,0,.5);
  transition:transform .3s;
}
.gacha-box.shake{animation:boxShake .5s ease-in-out infinite}
.gacha-box.glow-common{border-color:#b0b0b0;box-shadow:0 0 30px #b0b0b0}
.gacha-box.glow-rare{border-color:#54a0ff;box-shadow:0 0 40px #54a0ff,0 0 80px rgba(84,160,255,.4)}
.gacha-box.glow-epic{border-color:#a55eea;box-shadow:0 0 40px #a55eea,0 0 80px rgba(165,94,234,.5)}
.gacha-box.glow-legendary{border-color:#ffd700;box-shadow:0 0 50px #ffd700,0 0 100px rgba(255,215,0,.6);animation:legendPulse .6s ease-in-out infinite}
.gacha-box.glow-mythic{border-color:#ff006e;box-shadow:0 0 50px #ff006e,0 0 100px rgba(255,0,110,.7);animation:mythicPulse .5s ease-in-out infinite}
@keyframes boxShake{0%,100%{transform:rotate(-3deg) scale(1)}25%{transform:rotate(5deg) scale(1.05)}50%{transform:rotate(-5deg) scale(1.08)}75%{transform:rotate(3deg) scale(1.05)}}
@keyframes legendPulse{0%,100%{box-shadow:0 0 40px #ffd700,0 0 80px rgba(255,215,0,.5)}50%{box-shadow:0 0 70px #ffd700,0 0 140px rgba(255,215,0,.8)}}
@keyframes mythicPulse{0%,100%{box-shadow:0 0 40px #ff006e,0 0 80px rgba(255,0,110,.5)}50%{box-shadow:0 0 80px #ff006e,0 0 160px rgba(255,0,110,.9)}}

.gacha-card{
  width:160px;padding:20px 16px;border-radius:16px;text-align:center;
  border:3px solid;position:relative;overflow:hidden;
  animation:cardReveal .8s cubic-bezier(.34,1.56,.64,1) forwards;
  transform-style:preserve-3d;
}
.gacha-card::before{
  content:'';position:absolute;inset:-50%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);
  animation:cardShine 1.5s ease-in-out .3s;
}
@keyframes cardReveal{
  0%{transform:scale(0) rotateY(180deg);opacity:0}
  50%{transform:scale(1.15) rotateY(20deg);opacity:1}
  100%{transform:scale(1) rotateY(0);opacity:1}
}
@keyframes cardShine{0%{transform:translateX(-100%) rotate(45deg)}100%{transform:translateX(100%) rotate(45deg)}}
.gacha-card.common{border-color:#b0b0b0;background:linear-gradient(160deg,rgba(176,176,176,.25),rgba(80,80,80,.3))}
.gacha-card.rare{border-color:#54a0ff;background:linear-gradient(160deg,rgba(84,160,255,.3),rgba(30,60,120,.4));box-shadow:0 0 30px rgba(84,160,255,.5),0 0 60px rgba(84,160,255,.2)}
.gacha-card.epic{border-color:#a55eea;background:linear-gradient(160deg,rgba(165,94,234,.35),rgba(80,30,120,.45));box-shadow:0 0 35px rgba(165,94,234,.6),0 0 70px rgba(165,94,234,.25)}
.gacha-card.legendary{border-color:#ffd700;background:linear-gradient(160deg,rgba(255,215,0,.35),rgba(180,100,0,.4));box-shadow:0 0 40px rgba(255,215,0,.7),0 0 80px rgba(255,150,0,.3);animation:cardReveal .8s cubic-bezier(.34,1.56,.64,1) forwards,legendCardGlow 1.5s ease-in-out infinite .8s}
.gacha-card.mythic{border-color:#ff006e;background:linear-gradient(160deg,rgba(255,0,110,.4),rgba(120,0,60,.5));box-shadow:0 0 45px rgba(255,0,110,.8),0 0 90px rgba(255,0,110,.35);animation:cardReveal .8s cubic-bezier(.34,1.56,.64,1) forwards,mythicCardGlow 1.2s ease-in-out infinite .8s}
@keyframes legendCardGlow{0%,100%{box-shadow:0 0 40px rgba(255,215,0,.7),0 0 80px rgba(255,150,0,.3)}50%{box-shadow:0 0 60px rgba(255,215,0,.9),0 0 120px rgba(255,150,0,.5)}}
@keyframes mythicCardGlow{0%,100%{box-shadow:0 0 45px rgba(255,0,110,.8),0 0 90px rgba(255,0,110,.35)}50%{box-shadow:0 0 70px rgba(255,0,110,1),0 0 140px rgba(255,0,110,.5)}}

.gacha-flash{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:0}
.gacha-flash.active{animation:screenFlash .4s ease-out}
@keyframes screenFlash{0%{opacity:0.7;background:#fff}100%{opacity:0}}
.gacha-flash.rare{background:#54a0ff}.gacha-flash.epic{background:#a55eea}
.gacha-flash.legendary{background:#ffd700}.gacha-flash.mythic{background:#ff006e}

.gacha-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:12px}
.gacha-particle{position:absolute;width:6px;height:6px;border-radius:50%;animation:particleFly 1.2s ease-out forwards}
@keyframes particleFly{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}
.rarity-banner{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  padding:4px 16px;border-radius:20px;font-weight:900;font-size:13px;
  letter-spacing:1px;opacity:0;animation:bannerIn .5s ease .4s forwards;
  text-shadow:0 0 10px currentColor;
}
@keyframes bannerIn{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
.rarity-banner.common{background:rgba(176,176,176,.3);color:#ddd}
.rarity-banner.rare{background:rgba(84,160,255,.35);color:#7ec8ff}
.rarity-banner.epic{background:rgba(165,94,234,.4);color:#d4a5ff}
.rarity-banner.legendary{background:rgba(255,215,0,.4);color:#ffe566}
.rarity-banner.mythic{background:rgba(255,0,110,.45);color:#ff6eb0}

.gacha-skip{position:absolute;bottom:8px;right:8px;font-size:11px;opacity:.5;cursor:pointer;z-index:5}
#gachaBtns.disabled{opacity:.4;pointer-events:none}

.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;max-width:700px;max-height:300px;overflow-y:auto;margin:8px 0}
.skin-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.skin-card{width:64px;padding:6px;border-radius:8px;text-align:center;cursor:pointer;border:2px solid transparent;background:rgba(255,255,255,.06)}
.skin-card.selected{border-color:#00e5ff}.skin-card.locked{opacity:.4}
.daily-box{background:rgba(255,255,255,.06);border-radius:12px;padding:14px 18px;margin:8px 0;text-align:center;max-width:340px}
.daily-streak{font-size:20px;font-weight:900;color:#ffd700;margin:4px 0}
.matchmaking{text-align:center;padding:24px}
.matchmaking .spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.15);border-top-color:#00e5ff;border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#joystickLeft,#joystickRight{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.25);display:none;z-index:15;pointer-events:auto;touch-action:none}
#joystickLeft{bottom:24px;left:20px}#joystickRight{bottom:24px;right:20px}
.joystick-knob{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.45);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 12px rgba(0,229,255,.4)}
@media(max-width:900px),(pointer:coarse),(hover:none){#joystickLeft,#joystickRight{display:block}#abilityBar{bottom:170px}#hcBar{bottom:230px}}
/* Ability buttons larger for touch */
#abilityBar .ability{width:64px;height:64px;font-size:12px;pointer-events:auto;touch-action:manipulation}
#abilityBar{pointer-events:auto}
.info-box{background:rgba(0,0,0,.4);border-radius:10px;padding:8px 12px;font-size:11px;opacity:.8;max-width:400px;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas"></canvas>
<div id="ui">
<div id="hud" style="display:none">
<div class="hud-box"><div class="label">KILLS</div><div class="value" id="killCount">0</div></div>
<div class="hud-box"><div class="label">TIME</div><div class="value" id="timer">0:00</div></div>
<div class="hud-box"><div class="label">ALIVE</div><div class="value" id="aliveCount">1</div></div>
</div>
<div id="hcBar" style="display:none"><div id="hcFill"></div></div>
<div id="abilityBar" style="display:none">
<div class="ability" id="gadgetBtn">GADGET<br><span style="font-size:9px">Q</span><div class="cd" id="gadgetCd"></div></div>
<div class="ability" id="superBtn">SUPER<br><span style="font-size:9px">SPACE</span><div class="cd" id="superCd"></div></div>
<div class="ability" id="hcBtn">HYPER<br><span style="font-size:9px">E</span><div class="cd" id="hcCd"></div></div>
</div>
</div>
<div class="currency-bar" id="currencyBar">
<div class="rank-badge" id="rankBadge">ブロンズ I</div>
<div class="currency coins">🪙 <span id="coinCount">0</span></div>
<div class="currency gems">💎 <span id="gemCount">0</span></div>
<div class="currency trophies">🏆 <span id="trophyCount">0</span></div>
</div>
<div id="startMenu" class="menu">
<div class="title">BRAWL ARENA</div>
<div class="subtitle">ULTIMATE — ガジェット / ハイパーチャージ / スターパワー対応</div>
<div class="tab-bar">
<button class="tab-btn active" data-tab="play">プレイ</button>
<button class="tab-btn" data-tab="skins">スキン</button>
<button class="tab-btn" data-tab="collection">図鑑</button>
<button class="tab-btn" data-tab="gacha">ガチャ</button>
<button class="tab-btn" data-tab="daily">デイリー</button>
</div>
<div id="tabPlay">
<div class="brawler-select" id="brawlerSelect"></div>
<div class="info-box">Q:ガジェット　SPACE:スーパー　E:ハイパーチャージ　パワーキューブで強化</div>
<div class="menu-buttons">
<button class="btn" id="startBtn">カジュアル</button>
<button class="btn ranked" id="rankedBtn">ランクマッチ</button>
</div>
</div>
<div id="tabSkins" style="display:none">
<div class="brawler-select" id="skinBrawlerSelect" style="max-height:120px"></div>
<div class="skin-row" id="skinList"></div>
<button class="btn secondary" id="backFromSkins">戻る</button>
</div>
<div id="tabCollection" style="display:none">
<div class="collection-grid" id="collectionGrid"></div>
<button class="btn secondary" id="backFromCollection">戻る</button>
</div>
<div id="tabGacha" style="display:none">
<div id="gachaStage">
  <div id="gachaResult" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">
    <div style="opacity:.5;font-size:13px;text-align:center">下のボタンでガチャを回そう<br><span style="font-size:11px">レア以上は特別演出！</span></div>
  </div>
</div>
<div id="gachaFlash" class="gacha-flash"></div>
<div class="menu-buttons" id="gachaBtns" style="pointer-events:auto;position:relative;z-index:30">
<button class="btn gacha" id="gachaBtn" type="button" style="pointer-events:auto;touch-action:manipulation;cursor:pointer">×1（100🪙）</button>
<button class="btn gem" id="gachaGemBtn" type="button" style="pointer-events:auto;touch-action:manipulation;cursor:pointer">×1（30💎）</button>
</div>
<button class="btn secondary" id="backFromGacha">戻る</button>
</div>
<div id="tabDaily" style="display:none">
<div class="daily-box">
<div style="font-size:14px;font-weight:900">📅 デイリーボーナス</div>
<div class="daily-streak" id="streakDisplay">連続 0 日</div>
<div id="dailyRewardInfo" style="font-size:12px;opacity:.8;margin:6px 0"></div>
<button class="btn daily" id="claimDailyBtn">受け取る</button>
</div>
<button class="btn secondary" id="backFromDaily">戻る</button>
</div>
</div>
<div id="matchmakingMenu" class="menu hidden">
<div class="matchmaking"><div class="spinner"></div>
<div style="font-size:18px;font-weight:900" id="mmTitle">マッチメイキング中...</div>
<div style="opacity:.7;font-size:13px" id="mmSub">対戦相手を探しています</div>
</div></div>
<div id="gameOverMenu" class="menu hidden" style="z-index:50">
<div class="title" id="resultTitle">VICTORY!</div>
<div id="gameOverStats" style="min-width:280px">
<div class="stat" style="font-size:18px;margin-bottom:8px" id="resultSub">バトル終了</div>
<div class="stat">キル数: <span id="finalKills">0</span></div>
<div class="stat">生存時間: <span id="finalTime">0:00</span></div>
<div class="stat">獲得パワー: <span id="finalPower">0</span></div>
<div class="stat" style="color:#00e5ff;margin-top:10px;font-size:16px;font-weight:900" id="rewardText"></div>
<div class="stat" id="rankChange" style="font-size:13px;margin-top:6px;opacity:.85"></div>
</div>
<div class="menu-buttons" style="margin-top:8px">
<button class="btn" id="restartBtn">もう一度プレイ</button>
<button class="btn secondary" id="menuBtn">メニューに戻る</button>
</div>
</div>
<div id="joystickLeft"><div class="joystick-knob" id="knobLeft"></div></div>
<div id="joystickRight"><div class="joystick-knob" id="knobRight"></div></div>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
function resize(){const maxW=Math.min(window.innerWidth-10,1280),maxH=Math.min(window.innerHeight-10,720),r=16/9;let w=maxW,h=maxW/r;if(h>maxH){h=maxH;w=h*r}canvas.width=w;canvas.height=h;canvas.style.width=w+'px';canvas.style.height=h+'px'}
window.addEventListener('resize',resize);resize();
const SAVE_KEY='brawlArenaSave_v4';
let save={coins:1000,gems:100,trophies:0,unlocked:['shelly','colt','bull'],selected:'shelly',skins:{},selectedSkins:{},lastDaily:'',dailyStreak:0,starPowers:{}};
function loadSave(){try{const r=localStorage.getItem(SAVE_KEY);if(r)save={...save,...JSON.parse(r)}}catch(e){}
  if(typeof save.coins!=='number'||save.coins<0)save.coins=1000;
  if(typeof save.gems!=='number'||save.gems<0)save.gems=100;
  if(!Array.isArray(save.unlocked)||save.unlocked.length===0)save.unlocked=['shelly','colt','bull'];
  updateCurrencyUI();updateRankBadge()}
function saveData(){localStorage.setItem(SAVE_KEY,JSON.stringify(save));updateCurrencyUI();updateRankBadge()}
function updateCurrencyUI(){document.getElementById('coinCount').textContent=save.coins;document.getElementById('gemCount').textContent=save.gems;document.getElementById('trophyCount').textContent=save.trophies}
const RANKS=[{name:'ブロンズ I',min:0,color:'#cd7f32'},{name:'ブロンズ II',min:50,color:'#cd7f32'},{name:'ブロンズ III',min:100,color:'#cd7f32'},{name:'シルバー I',min:160,color:'#c0c0c0'},{name:'シルバー II',min:230,color:'#c0c0c0'},{name:'シルバー III',min:300,color:'#c0c0c0'},{name:'ゴールド I',min:400,color:'#ffd700'},{name:'ゴールド II',min:520,color:'#ffd700'},{name:'ゴールド III',min:650,color:'#ffd700'},{name:'ダイヤ I',min:800,color:'#00e5ff'},{name:'ダイヤ II',min:1000,color:'#00e5ff'},{name:'ダイヤ III',min:1200,color:'#00e5ff'},{name:'ミシック',min:1500,color:'#a55eea'},{name:'レジェンド',min:2000,color:'#ff6b00'},{name:'マスター',min:2800,color:'#ff006e'}];
function getRank(t){let r=RANKS[0];for(const rank of RANKS)if(t>=rank.min)r=rank;return r}

let leftStick={active:false,dx:0,dy:0},rightStick={active:false,dx:0,dy:0,shooting:false};
function setupJoystick(el,knob,isLeft){
  const stick=isLeft?leftStick:rightStick;
  const onStart=e=>{
    e.preventDefault();e.stopPropagation();
    const t=e.changedTouches?e.changedTouches[0]:e;
    stick.active=true;
    updStick(t,el,knob,stick);
  };
  const onMove=e=>{
    e.preventDefault();e.stopPropagation();
    if(!stick.active)return;
    const t=e.changedTouches?e.changedTouches[0]:e;
    updStick(t,el,knob,stick);
  };
  const onEnd=e=>{
    e.preventDefault();
    stick.active=false;stick.dx=0;stick.dy=0;
    if(!isLeft)stick.shooting=false;
    knob.style.transform='translate(-50%,-50%)';
  };
  el.addEventListener('touchstart',onStart,{passive:false});
  el.addEventListener('touchmove',onMove,{passive:false});
  el.addEventListener('touchend',onEnd,{passive:false});
  el.addEventListener('touchcancel',onEnd,{passive:false});
  // mouse fallback for testing
  el.addEventListener('mousedown',onStart);
  window.addEventListener('mousemove',e=>{if(stick.active)onMove(e)});
  window.addEventListener('mouseup',onEnd);
}
function updStick(t,el,knob,stick){
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=(t.clientX||t.pageX)-cx, dy=(t.clientY||t.pageY)-cy;
  const max=48,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  stick.dx=dx/max;stick.dy=dy/max;
  if(!el.id.includes('Left')) stick.shooting = len > 8; // auto fire when aiming
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

get dmg(){let d=this.b.damage*(1+this.power*.12);if(this.hcActive)d*=this.b.hyper.mult;return d}
get spd(){let s=this.b.speed*(1+this.power*.04);if(this.speedBoost>0)s*=1.5;if(this.hcActive)s*=1.15;return s}
takeDamage(amt,from){if(this.invuln>0||!this.alive||this.invisible)return;if(this.shield>0){this.shield-=amt;if(this.shield<0){amt=-this.shield;this.shield=0}else return}this.hp-=amt;this.invuln=.1;spawnP(this.x,this.y,this.color,4,2);if(this.hp<=0){this.hp=0;this.alive=false;spawnP(this.x,this.y,this.color,22,5);if(from&&from.isPlayer){kills++;from.superC=Math.min(from.b.superCharge,from.superC+2);from.hcCharge=Math.min(100,from.hcCharge+25)}if(from)from.kills++;for(let i=0;i<1+Math.floor(this.power/2);i++)powerCubes.push(new PowerCube(this.x+(Math.random()-.5)*40,this.y+(Math.random()-.5)*40))}}

class Bullet extends Entity{

function updateAI(bot,dt){bot.aiT-=dt;let n=null,nd=1e9;for(const c of characters){if(c===bot||!c.alive||c.invisible)continue;const d=dist(bot,c);if(d<nd){nd=d;n=c}}let nc=null,cd=1e9;if(bot.power<5)for(const p of powerCubes){const d=dist(bot,p);if(d<cd){cd=d;nc=p}}

  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();
}
for(let y=-(camera.y%gs);y<canvas.height+gs;y+=gs){
  const alpha=0.03+0.025*Math.cos((y+camera.y)*0.01);
  ctx.strokeStyle=`rgba(80,160,220,${alpha})`;
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
}
// Subtle radial vignette for depth
const vig=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.height*0.3,canvas.width/2,canvas.height/2,canvas.height*0.85);
vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.35)');
ctx.fillStyle=vig;ctx.fillRect(0,0,canvas.width,canvas.height);

for(const o of obstacles){
  if(o.type==='box'&&o.hp<=0)continue;
  const sx=o.x-camera.x,sy=o.y-camera.y;
  if(o.type==='wall'){
    // Wall with top highlight for 3D
    ctx.fillStyle='#1e2a38';ctx.fillRect(sx,sy,o.w,o.h);
    ctx.fillStyle='rgba(100,140,180,0.15)';ctx.fillRect(sx,sy,o.w,6);
    ctx.strokeStyle='#0d1520';ctx.lineWidth=2;ctx.strokeRect(sx,sy,o.w,o.h);
  } else {
    const hr=o.hp/800;
    // Box body
    const base=`rgb(${70+(1-hr)*55},${40+(1-hr)*15},25)`;
    ctx.fillStyle=base;ctx.fillRect(sx,sy,o.w,o.h);
    // Top face (lighter)
    ctx.fillStyle=`rgba(160,110,60,${0.35+hr*0.2})`;ctx.fillRect(sx,sy,o.w,8);
    // Side shade
    ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(sx+o.w-8,sy,8,o.h);
    // Crate lines
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(sx,sy+o.h/2);ctx.lineTo(sx+o.w,sy+o.h/2);ctx.moveTo(sx+o.w/2,sy);ctx.lineTo(sx+o.w/2,sy+o.h);ctx.stroke();
    ctx.strokeStyle='#5d4037';ctx.lineWidth=2;ctx.strokeRect(sx,sy,o.w,o.h);
  }
}
for(const p of powerCubes)p.draw(camera.x,camera.y);for(const b of bullets){try{b.draw(camera.x,camera.y)}catch(e){}}for(const c of characters){try{c.draw(camera.x,camera.y)}catch(e){}}for(const p of particles)p.draw(camera.x,camera.y);
const mw=140,mh=90,mx=canvas.width-mw-6,my=6,sx=mw/WORLD.width,sy=mh/WORLD.height;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(mx-2,my-2,mw+4,mh+4);ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1.5;ctx.strokeRect(mx-2,my-2,mw+4,mh+4);
ctx.fillStyle='rgba(90,70,50,.5)';for(const o of obstacles){if(o.type==='box'&&o.hp<=0)continue;ctx.fillRect(mx+o.x*sx,my+o.y*sy,Math.max(1.5,o.w*sx),Math.max(1.5,o.h*sy))}
for(const c of characters){if(!c.alive)continue;ctx.beginPath();ctx.arc(mx+c.x*sx,my+c.y*sy,c.isPlayer?3:2.2,0,6.28);ctx.fillStyle=c.isPlayer?'#00e5ff':c.color;ctx.fill()}}
function renderBrawlerSelect(){const c=document.getElementById('brawlerSelect');c.innerHTML='';Object.keys(BRAWLERS).sort((a,b)=>RARITY_ORDER[BRAWLERS[a].rarity]-RARITY_ORDER[BRAWLERS[b].rarity]).forEach(key=>{const b=BRAWLERS[key],un=save.unlocked.includes(key),sk=getSkin(key);const card=document.createElement('div');card.className='brawler-card'+(key===selectedBrawler?' selected':'')+(un?'':' locked');card.innerHTML=`<div class="brawler-icon" style="background:linear-gradient(135deg,${sk.color},${sk.accent})">${b.name[0]}</div><div class="brawler-name">${b.name}</div><div class="brawler-rarity rarity-${b.rarity}">${b.rarity.toUpperCase()}</div><div class="brawler-desc">${b.desc}</div>`;if(un)card.onclick=()=>{selectedBrawler=key;save.selected=key;saveData();renderBrawlerSelect()};c.appendChild(card)})}
function renderSkinB(){const c=document.getElementById('skinBrawlerSelect');c.innerHTML='';save.unlocked.forEach(key=>{const b=BRAWLERS[key],sk=getSkin(key);const card=document.createElement('div');card.className='brawler-card'+(key===selectedBrawler?' selected':'');card.style.width='85px';card.innerHTML=`<div class="brawler-icon" style="background:linear-gradient(135deg,${sk.color},${sk.accent});width:36px;height:36px;font-size:14px">${b.name[0]}</div><div class="brawler-name" style="font-size:10px">${b.name}</div>`;card.onclick=()=>{selectedBrawler=key;renderSkinB();renderSkinL()};c.appendChild(card)})}
function renderSkinL(){const l=document.getElementById('skinList');l.innerHTML='';(SKINS[selectedBrawler]||[]).forEach(s=>{const un=isSkinUnlocked(selectedBrawler,s.id);const card=document.createElement('div');card.className='skin-card'+((save.selectedSkins[selectedBrawler]||'default')===s.id?' selected':'')+(un?'':' locked');card.innerHTML=`<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,${s.color},${s.accent});margin:0 auto 3px"></div><div style="font-size:9px;font-weight:700">${s.name}</div>${!un&&s.cost?`<div style="font-size:8px;opacity:.7">${s.cost}🪙</div>`:''}`;if(un)card.onclick=()=>{save.selectedSkins[selectedBrawler]=s.id;saveData();renderSkinL();renderBrawlerSelect()};else if(s.cost)card.onclick=()=>{if(save.coins>=s.cost){save.coins-=s.cost;if(!save.skins[selectedBrawler])save.skins[selectedBrawler]=[];save.skins[selectedBrawler].push(s.id);save.selectedSkins[selectedBrawler]=s.id;saveData();renderSkinL();renderBrawlerSelect();alert(s.name+' 購入！')}else alert('コイン不足')};l.appendChild(card)})}
function renderCol(){const g=document.getElementById('collectionGrid');g.innerHTML='';Object.keys(BRAWLERS).forEach(key=>{const b=BRAWLERS[key],un=save.unlocked.includes(key),sk=getSkin(key);const card=document.createElement('div');card.className='brawler-card'+(un?'':' locked');card.style.width='85px';card.innerHTML=`<div class="brawler-icon" style="background:linear-gradient(135deg,${sk.color},${sk.accent});width:36px;height:36px;font-size:14px">${b.name[0]}</div><div class="brawler-name" style="font-size:10px">${b.name}</div><div class="brawler-rarity rarity-${b.rarity}">${b.rarity}</div>`;g.appendChild(card)})}
function doGacha(useGems){
  // Always ensure buttons are clickable
  var btns = document.getElementById('gachaBtns');
  if(btns) btns.classList.remove('disabled');

  try {
    var costCoins = 100, costGems = 30;
    if(useGems){
      if((save.gems|0) < costGems){ alert('ジェムが足りません（必要:30）'); return; }
      save.gems = (save.gems|0) - costGems;
    } else {
      if((save.coins|0) < costCoins){ alert('コインが足りません（必要:100）'); return; }
      save.coins = (save.coins|0) - costCoins;
    }

    var res = rollGacha();
    if(!res || !res.key || !BRAWLERS[res.key]){
      alert('ガチャエラー');
      return;
    }

    if(res.isNew){
      if(!save.unlocked) save.unlocked = [];
      if(save.unlocked.indexOf(res.key) < 0) save.unlocked.push(res.key);
    } else {
      var d = 10;
      if(res.rarity==='mythic') d=120;
      else if(res.rarity==='legendary') d=80;
      else if(res.rarity==='epic') d=40;
      else if(res.rarity==='rare') d=20;
      save.coins = (save.coins|0) + d;
    }
    saveData();
    updateCurrencyUI();

    // Show result (with animation if available)
    if(typeof playGachaAnimation === 'function'){
      try {
        if(btns) btns.classList.add('disabled');
        playGachaAnimation(res, function(){
          if(btns) btns.classList.remove('disabled');
          try{ renderBrawlerSelect(); }catch(e){}
        });
        // Safety: always re-enable after 4s max
        setTimeout(function(){ if(btns) btns.classList.remove('disabled'); }, 4000);
      } catch(animErr){
        console.error(animErr);
        if(btns) btns.classList.remove('disabled');
        showGachaSimple(res);
      }
    } else {
      showGachaSimple(res);
    }
  } catch(err) {
    console.error('doGacha', err);
    alert('ガチャエラー: ' + (err && err.message ? err.message : err));
    if(btns) btns.classList.remove('disabled');
  }
}

function showGachaSimple(res){
  var b = BRAWLERS[res.key];
  var stage = document.getElementById('gachaResult');
  if(!stage){ alert((res.isNew?'NEW ':'') + b.name + ' ('+res.rarity+')'); return; }
  stage.innerHTML = '<div class="gacha-card '+res.rarity+'" style="border:3px solid;padding:16px;border-radius:12px;text-align:center">'
    + '<div style="width:56px;height:56px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,'+b.color+','+b.accent+');display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900">'+b.name[0]+'</div>'
    + '<div style="font-size:16px;font-weight:900">'+b.name+'</div>'
    + '<div class="rarity-'+res.rarity+'" style="font-size:12px">'+res.rarity.toUpperCase()+'</div>'
    + '<div style="font-size:12px;margin-top:6px">'+(res.isNew?'NEW アンロック！':'重複 → コイン')+'</div></div>';
  try{ renderBrawlerSelect(); }catch(e){}
}

function playGachaAnimation(res, onDone){
  const stage = document.getElementById('gachaResult');
  const flash = document.getElementById('gachaFlash');
  if(!stage){ onDone&&onDone(); return; }
  
  const b = BRAWLERS[res.key];
  const rarity = res.rarity;
  const rarityJP = {common:'コモン',rare:'レア',epic:'エピック',legendary:'レジェンド',mythic:'ミシック'}[rarity]||rarity;
  const delay = rarity==='mythic'?2800 : rarity==='legendary'?2400 : rarity==='epic'?2000 : rarity==='rare'?1600 : 1100;
  
  // Stage 1: Closed box shaking
  stage.innerHTML = '<div class="gacha-box shake glow-'+rarity+'">📦</div>';
  
  // Stage 2: Intensify glow
  setTimeout(()=>{
    const box = stage.querySelector('.gacha-box');
    if(box){ box.classList.remove('shake'); box.style.transform='scale(1.2)'; box.textContent='✨'; }
  }, delay*0.35);
  
  // Stage 3: Screen flash for rare+
  setTimeout(()=>{
    if(flash && rarity!=='common'){
      flash.className = 'gacha-flash active '+rarity;
      setTimeout(()=>flash.className='gacha-flash', 450);
    }
  }, delay*0.5);
  
  // Stage 4: Card reveal + particles
  setTimeout(()=>{
    const particles = [];
    const cols = {common:'#b0b0b0',rare:'#54a0ff',epic:'#a55eea',legendary:'#ffd700',mythic:'#ff006e'};
    const col = cols[rarity]||'#fff';
    const pCount = rarity==='mythic'?40 : rarity==='legendary'?30 : rarity==='epic'?20 : rarity==='rare'?12 : 6;
    let pHtml = '';
    for(let i=0;i<pCount;i++){
      const angle = Math.random()*6.28;
      const dist = 60+Math.random()*120;
      const tx = Math.cos(angle)*dist;
      const ty = Math.sin(angle)*dist-40;
      const size = 4+Math.random()*6;
      pHtml += '<div class="gacha-particle" style="left:50%;top:50%;width:'+size+'px;height:'+size+'px;background:'+col+';--tx:'+tx+'px;--ty:'+ty+'px;animation-delay:'+(Math.random()*0.3)+'s"></div>';
    }
    
    stage.innerHTML = `
      <div class="gacha-particles">${pHtml}</div>
      <div class="rarity-banner ${rarity}">${rarityJP}</div>
      <div class="gacha-card ${rarity}">
        <div class="brawler-icon" style="background:linear-gradient(135deg,${b.color},${b.accent});width:64px;height:64px;font-size:28px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.4)">${b.name[0]}</div>
        <div class="brawler-name" style="font-size:18px;font-weight:900;margin-bottom:4px">${b.name}</div>
        <div class="brawler-rarity rarity-${rarity}" style="font-size:13px;margin-bottom:8px">${rarity.toUpperCase()}</div>
        <div style="font-size:12px;opacity:.9">${res.isNew ? '🎉 NEW アンロック！' : '重複 → コイン還元'}</div>
        <div style="font-size:11px;opacity:.6;margin-top:6px">${b.desc||''}</div>
      </div>`;
    
    setTimeout(()=>{ onDone && onDone(); }, 900);
  }, delay*0.55);
}

(function setupGachaButtons(){
  function fireCoins(){ doGacha(false); }
  function fireGems(){ doGacha(true); }
  function bind(el, fn){
    if(!el) return;
    el.onclick = function(e){ e.preventDefault(); e.stopPropagation(); fn(); };
    el.ontouchend = function(e){ e.preventDefault(); e.stopPropagation(); fn(); };
    el.addEventListener('click', function(e){ e.preventDefault(); fn(); }, true);
  }
  bind(document.getElementById('gachaBtn'), fireCoins);
  bind(document.getElementById('gachaGemBtn'), fireGems);
  bind(document.getElementById('claimDailyBtn'), function(){ claimDaily(); });
  // Event delegation backup
  var menu = document.getElementById('startMenu');
  if(menu){
    menu.addEventListener('click', function(e){
      var t = e.target;
      while(t && t !== menu){
        if(t.id === 'gachaBtn'){ e.preventDefault(); fireCoins(); return; }
        if(t.id === 'gachaGemBtn'){ e.preventDefault(); fireGems(); return; }
        t = t.parentNode;
      }
    }, true);
  }
  // Ensure never stuck disabled on load
  var btns = document.getElementById('gachaBtns');
  if(btns) btns.classList.remove('disabled');
})();

['backFromSkins','backFromCollection','backFromGacha','backFromDaily'].forEach(id=>document.getElementById(id).onclick=()=>document.querySelector('.tab-btn[data-tab="play"]').click());
